name: CI

on:
  push:
  pull_request:

jobs:
  boot:
    # The gate is not "it compiles": it is "it boots and the self-test passes".
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu for riscv64
        # The package that carries qemu-system-riscv64 differs between Ubuntu
        # releases: try the riscv-specific package, fall back to the misc one,
        # then assert the binary exists instead of failing later with
        # "failed to execute process: No such file or directory".
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-riscv || sudo apt-get install -y qemu-system-misc
          command -v qemu-system-riscv64 || { echo "qemu-system-riscv64 is missing"; apt-cache search qemu | head -20; exit 1; }
          qemu-system-riscv64 --version
      - name: Install the bare-metal target
        run: rustup target add riscv64gc-unknown-none-elf
      - name: Build the guest ELF
        # The kernel embeds assets/hello.elf with include_bytes!, so the guest
        # is built first: no guest, no kernel.
        run: |
          chmod +x tools/*.sh
          tools/build-user.sh
      - name: Build and boot
        run: tools/check.sh
